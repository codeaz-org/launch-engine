name: publish

# Merge to main = approval. Schedules approved drafts in Buffer, then commits the log/queue
# to the `state` branch (main only accepts PRs).
# Off until the repo variable PUBLISH_ENABLED is set to "true".
on:
  push:
    branches: [main]
    paths: ['drafts/**']
  schedule:
    - cron: '17 6 * * *'   # daily drain of queue/pending.jsonl when Buffer has room
  workflow_dispatch:
    inputs:
      drafts:
        description: 'Space-separated draft paths to enqueue (e.g. ones merged while publishing was off)'
        required: false
        default: ''

concurrency:
  group: state-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check out state branch
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git worktree add state origin/state && git -C state switch -c state
          else
            git worktree add --orphan -b state state
          fi
      - name: Find merged drafts
        id: drafts
        run: |
          files="${{ inputs.drafts }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            files=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'drafts/**/*.md' | tr '\n' ' ')
          fi
          echo "files=${files:-}" >> "$GITHUB_OUTPUT"
      - name: Schedule in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/publish.mjs ${{ steps.drafts.outputs.files }}
      - name: Commit log and queue to state
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "publish: log Buffer posts" && git push origin state; }
